<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ricochet: AI summary preview</title>
<style>
:root { --bg: #0b1118; --panel: #111a24; --line: #233243; --fg: #dfe7ee; --muted: #8796a6; --accent: #e9b44c; --ok: #46b37b; --bad: #e06c6c;
  --f-body: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif; --f-mono: "IBM Plex Mono", Consolas, ui-monospace, monospace; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-body); }
main { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.muted, small { color: var(--muted); }
.stats { font: 13px var(--f-mono); color: var(--muted); margin: 10px 0 18px; }
.item { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin: 12px 0; }
.item.bad { border-left: 3px solid var(--bad); } .item.ok { border-left: 3px solid var(--ok); }
.meta { font: 12px var(--f-mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; }
.tag { font: 11px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; padding: 2px 7px; border-radius: 4px; border: 1px solid; }
.ok .tag { color: var(--ok); } .bad .tag { color: var(--bad); }
h2 { font-size: 18px; margin: 8px 0 4px; }
p { margin: 6px 0; }
a { color: var(--accent); }
ul { margin: 6px 0; padding-left: 18px; }
.why { color: var(--bad); font: 13px var(--f-mono); }
details { margin-top: 6px; } summary { cursor: pointer; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>AI summary preview</h1>
  <p class="muted">What Gemini wrote for each hotspot, and whether the checks kept it. Unlisted. Until they're switched on, these don't appear on the public cards. Nothing here is checked by a person: read the linked reporting.</p>
  <div class="stats" id="stats">Loading…</div>
  <div id="list"></div>
</main>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const when = t => new Date(t * 1000).toISOString().slice(5, 16).replace('T', ' ') + 'Z';
// [S3] -> a link to that signal's source
const cite = (text, refs) => esc(text).replace(/\[((?:S\d+(?:,\s*)?)+)\]/g, (m, ids) =>
  '[' + ids.split(/,\s*/).map(id => refs[id] && refs[id].url ? `<a href="${esc(refs[id].url)}" target="_blank" rel="noopener" title="${esc(refs[id].title)}">${id}</a>` : id).join(', ') + ']');
async function load() {
  let d;
  try { d = await (await fetch('/api/explanations?limit=80', { cache: 'no-store' })).json(); }
  catch (e) { document.getElementById('stats').textContent = 'Could not load.'; return; }
  const s = d.stats;
  document.getElementById('stats').textContent = s ? `Today: ${s.today.calls} calls, ${s.today.kept} kept · £${s.today.cost_gbp.toFixed(3)} · ${s.today.tokens_in.toLocaleString()} in / ${s.today.tokens_out.toLocaleString()} out tokens · all time £${s.all_time_gbp.toFixed(3)} · ${d.public ? 'LIVE on public cards' : 'preview only'}`
    : (d.message || 'Not set up yet.');
  document.getElementById('list').innerHTML = d.recent.map(r => {
    const a = r.answer || {}, refs = r.refs || {};
    const stories = (a.stories || []).map(x => `<li>${cite(x.text, refs)}</li>`).join('');
    const unrel = (a.unrelated || []).map(x => `<li>${esc(x.id)}: ${esc(x.why)}</li>`).join('');
    const tr = Object.entries(a.translations || {}).map(([k, v]) => `<li>${esc(k)}: ${esc(v)}</li>`).join('');
    const sigs = Object.entries(refs).map(([k, v]) => `<li>${esc(k)} [${esc(v.source)}] ${v.url ? `<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a>` : esc(v.title)}</li>`).join('');
    return `<div class="item ${r.ok ? 'ok' : 'bad'}">
      <div class="meta"><span class="tag">${r.ok ? 'kept' : 'rejected'}</span><span>${when(r.created)}</span><span>square ${esc(r.cell)}</span><span>${r.tokens_in}/${r.tokens_out} tokens · £${(r.cost_gbp || 0).toFixed(4)}</span><span>${esc(r.model)}</span></div>
      ${r.reason ? `<p class="why">${esc(r.reason)}</p>` : ''}
      ${a.title ? `<h2>${esc(a.title)}</h2>` : ''}
      ${a.summary ? `<p>${cite(a.summary, refs)}</p>` : ''}
      ${stories ? `<ul>${stories}</ul>` : ''}
      ${a.gaps ? `<p class="muted">Can't tell: ${esc(a.gaps)}</p>` : ''}
      <details><summary>Signals it saw, unrelated, translations</summary>
        <ul>${sigs}</ul>${unrel ? `<p class="muted">Unrelated:</p><ul>${unrel}</ul>` : ''}${tr ? `<p class="muted">Translations:</p><ul>${tr}</ul>` : ''}
      </details></div>`;
  }).join('') || '<p class="muted">No summaries yet. They appear within a minute or two of a hotspot opening once the key is set up.</p>';
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
